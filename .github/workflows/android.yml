name: 构建并发布 ZeroTermux

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK
        run: |
          export NEW_SDK_ROOT=${{ github.workspace }}/custom-android-sdk
          mkdir -p $NEW_SDK_ROOT

          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$NEW_SDK_ROOT \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;30.0.2" \
            "ndk;29.0.14206865"

          cp -r ${ANDROID_HOME}/licenses $NEW_SDK_ROOT/

          echo "ANDROID_HOME=$NEW_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$NEW_SDK_ROOT" >> $GITHUB_ENV

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 下载 Bootstrap 文件
        run: ./gradlew downloadBootstraps --stacktrace

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 确定发布名称
        id: set_name
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "APP_NAME=$TAG_NAME" >> $GITHUB_ENV
            echo "TAGGED=true" >> $GITHUB_ENV
            echo "Detected Tag: $TAG_NAME"
          else
            echo "APP_NAME=ZeroTermux-Nightly" >> $GITHUB_ENV
            echo "TAGGED=false" >> $GITHUB_ENV
            echo "Branch build, using nightly name."
          fi

      - name: 重命名 APK 文件
        run: |
          find app/build/outputs/apk -type f -name "*.apk" | while read file; do
            dir=$(dirname "$file")
            filename=$(basename "$file")
            new_filename="${filename/termux-app/${{ env.APP_NAME }}}"
            mv "$file" "$dir/$new_filename"
            echo "已重命名: $filename -> $new_filename"
          done

      - name: 上传 APK 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTermux-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 发布 Nightly（主分支推送）
        uses: softprops/action-gh-release@v2
        if: env.TAGGED == 'false' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          overwrite: true
          body: |
            自动构建于 `${{ github.sha }}`
            提交信息: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建正式发布（Tag 推送）
        uses: softprops/action-gh-release@v2
        if: env.TAGGED == 'true'
        with:
          tag_name: ${{ env.APP_NAME }}
          name: ${{ env.APP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
